openapi: 3.0.3

# Solo las rutas. Ningun schema se define aqui: todo va por $ref a requests.yaml
# (lo que entra), resources.yaml (lo que sale) y responses.yaml (el envoltorio HTTP).
#
# El `tags` de cada operacion decide el nombre de la interfaz Java generada:
# tag `cotizacion` -> CotizacionApi / CotizacionApiDelegate.

info:
  title: API de Cotizacion de Envios
  description: |
    Ejercicio de contrato-primero. El contrato manda: los controllers y los modelos
    los genera openapi-generator, no se escriben a mano.
  version: 0.0.1

servers:
  - url: 'http://localhost:{port}'
    description: local
    variables:
      port:
        default: '8080'

tags:
  - name: cotizacion
    description: Cotizacion de envios y catalogo de zonas
  - name: propina
    description: Ejemplo de referencia, calculadora de propinas

paths:

  # === TU API · paquete com.teletubies.endpoints.cotizacion ===

  '/api/v1/cotizaciones':
    post:
      tags:
        - cotizacion
      summary: Cotiza un envio
      description: |
        Recibe origen, destino y peso del paquete, y devuelve el costo estimado junto
        con el tiempo de entrega.
      operationId: cotizarEnvio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './requests.yaml#/components/schemas/CotizarEnvioRequest'
      responses:
        "200":
          $ref: './responses.yaml#/components/responses/CotizacionResponse'
        "400":
          $ref: './responses.yaml#/components/responses/BadRequest'
        # TE TOCA A TI: falta la respuesta de regla de negocio incumplida (destino no
        # soportado, exceso de peso). No es un 400: el request esta bien formado.
        # Declarala en responses.yaml, referenciala aqui, regenera, y manejala en tu
        # @RestControllerAdvice. Documenta en el README que codigo elegiste.
        "500":
          $ref: './responses.yaml#/components/responses/InternalServerError'

  '/api/v1/zonas':
    get:
      tags:
        - cotizacion
      summary: Lista las zonas de destino soportadas
      description: |
        Permite al cliente conocer los destinos validos ANTES de intentar cotizar.
      operationId: listarZonas
      responses:
        "200":
          $ref: './responses.yaml#/components/responses/ZonasResponse'
        "500":
          $ref: './responses.yaml#/components/responses/InternalServerError'

  # === EJEMPLO DE REFERENCIA · paquete com.teletubies.endpoints.ejemplo ===
  #
  # Misma forma que tu API (un POST que calcula y un GET de catalogo) pero de otro
  # dominio. Esta aqui para que te guies; no cuenta para tu limite de 2 endpoints.

  '/api/v1/ejemplo/propinas':
    post:
      tags:
        - propina
      summary: Calcula la propina de una cuenta
      operationId: calcularPropina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './requests.yaml#/components/schemas/CalcularPropinaRequest'
      responses:
        "200":
          $ref: './responses.yaml#/components/responses/PropinaResponse'
        "400":
          $ref: './responses.yaml#/components/responses/BadRequest'
        "422":
          $ref: './responses.yaml#/components/responses/UnprocessableEntity'
        "500":
          $ref: './responses.yaml#/components/responses/InternalServerError'

  '/api/v1/ejemplo/monedas':
    get:
      tags:
        - propina
      summary: Lista las monedas soportadas
      operationId: listarMonedas
      responses:
        "200":
          $ref: './responses.yaml#/components/responses/MonedasResponse'
        "500":
          $ref: './responses.yaml#/components/responses/InternalServerError'
