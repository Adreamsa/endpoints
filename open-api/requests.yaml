openapi: 3.0.3

# Lo que ENTRA a la API.
#
# Las restricciones de aqui se vuelven anotaciones de Bean Validation en el modelo
# generado: required -> @NotNull, minLength/maxLength -> @Size, minimum/maximum ->
# @DecimalMin/@DecimalMax, pattern -> @Pattern. El @Valid lo pone el generador.
# Si una restriccion no esta aqui, no existe en tiempo de ejecucion.
#
# Validacion de FORMATO va aqui; regla de NEGOCIO no se puede expresar y va en tu
# service. Esa distincion se evalua.

components:
  schemas:

    # === TU API ===

    CotizarEnvioRequest:
      type: object
      description: Datos del paquete a cotizar.
      required:
        - origen
        - destino
        - pesoKg
      properties:
        origen:
          type: string
          description: Lugar desde donde sale el paquete.
          example: Orizaba
          minLength: 1
          maxLength: 60
        destino:
          # El enum vive en enum.yaml y lo referencian los dos lados: el catalogo de
          # GET /api/v1/zonas y este POST salen de la misma declaracion.
          $ref: './enum.yaml#/components/schemas/Zona'
        pesoKg:
          type: number
          format: double
          description: Peso del paquete en kilogramos.
          example: 12.5
          minimum: 0.01
          exclusiveMinimum: false
          # TE TOCA A TI: no hay `maximum` a proposito. El enunciado da dos reglas
          # sobre el tope de peso; decidir cual es el limite real y si el rechazo es
          # de formato (aqui) o de negocio (tu service) es parte de lo que se evalua.

    # === EJEMPLO DE REFERENCIA ===

    CalcularPropinaRequest:
      type: object
      description: Cuenta a repartir y porcentaje de propina a aplicar.
      required:
        - montoCuenta
        - porcentajePropina
        - numeroPersonas
        - moneda
      properties:
        montoCuenta:
          type: number
          format: double
          description: Monto de la cuenta, antes de propina.
          example: 200.00
          minimum: 0.01
        porcentajePropina:
          type: integer
          format: int32
          description: Porcentaje de propina a aplicar sobre la cuenta.
          example: 10
          minimum: 0
          maximum: 100
        numeroPersonas:
          type: integer
          format: int32
          description: Entre cuantas personas se reparte el total.
          example: 4
          minimum: 1
        moneda:
          $ref: './enum.yaml#/components/schemas/Moneda'
