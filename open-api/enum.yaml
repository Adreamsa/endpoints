openapi: 3.0.3

# Los catalogos de valores fijos. Estan aparte porque un enum no es ni entrada ni
# salida: viaja en la peticion y vuelve en la respuesta.
#
# Un enum de aqui se genera como todo lo demas, salvo que lo mapees en el pom.xml a una
# clase tuya (importMapping + schemaMapping). Mapeado, el contrato sigue documentando los
# valores validos pero la clase es tuya y puede llevar comportamiento: mira Moneda.java,
# donde cada valor carga su descripcion. El precio: este archivo y la clase tienen que
# decir lo mismo, y nadie lo verifica.

components:
  schemas:

    # Zonas de destino soportadas por la API de cotizacion.
    # Mapeado en pom.xml a cotizacion/enums/Zona.java (importMapping + schemaMapping),
    # por lo que el generador no produce una clase propia: la clase es manual y lleva
    # costoBase y diasEntrega junto a cada valor.
    Zona:
      type: string
      description: |
        Zona de destino del envio. Determina el costo base y el tiempo de entrega.
      example: NACIONAL
      enum:
        - LOCAL
        - NACIONAL
        - EXPRESS
        - INTERNACIONAL

    # Del ejemplo de referencia.
    Moneda:
      type: string
      description: Moneda soportada por la calculadora de propinas.
      example: MXN
      enum:
        - MXN
        - USD
        - EUR
