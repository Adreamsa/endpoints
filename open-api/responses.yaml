openapi: 3.0.3

# El envoltorio HTTP de cada respuesta: que significa el codigo y que cuerpo trae.
# La forma de los datos no se define aqui, se apunta a resources.yaml: un mismo schema
# se reusa en varias respuestas, y los errores en casi todas las rutas.
#
# Una respuesta sin `content` promete un cuerpo vacio.

components:
  responses:

    # === TU API ===

    CotizacionResponse:
      description: Cotizacion calculada correctamente.
      content:
        application/json:
          schema:
            $ref: './resources.yaml#/components/schemas/CotizacionResource'

    ZonasResponse:
      description: |
        Catalogo de zonas soportadas. Una lista vacia sigue siendo 200: "no hay zonas"
        es una respuesta valida, no un error.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: './resources.yaml#/components/schemas/ZonaResource'

    # === ERRORES · compartidos por todas las rutas ===

    BadRequest:
      description: |
        Error del cliente: JSON mal formado, campo obligatorio ausente, valor fuera de
        rango, un texto donde iba un numero.
      content:
        application/json:
          schema:
            $ref: './resources.yaml#/components/schemas/ErrorResource'

    UnprocessableEntity:
      description: |
        La peticion se entendio, pero su contenido incumple una regla de negocio.
      content:
        application/json:
          schema:
            $ref: './resources.yaml#/components/schemas/ErrorResource'

    InternalServerError:
      description: |
        Fallo por razones ajenas al cliente. No se expone el detalle interno.
      content:
        application/json:
          schema:
            $ref: './resources.yaml#/components/schemas/ErrorResource'

    # === EJEMPLO DE REFERENCIA ===

    PropinaResponse:
      description: Propina calculada correctamente.
      content:
        application/json:
          schema:
            $ref: './resources.yaml#/components/schemas/PropinaResource'

    MonedasResponse:
      description: Catalogo de monedas soportadas.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: './resources.yaml#/components/schemas/MonedaResource'
